<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SciPlan 小助手</title>
  <style>
    :root { --pet-size: 104px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    .pet-shell { position: relative; width: 360px; height: 300px; }
    #petImage { position: absolute; left: 5px; bottom: 5px; width: var(--pet-size); height: calc(var(--pet-size) * 1.2); object-fit: contain; cursor: pointer; filter: drop-shadow(0 9px 11px rgba(32, 48, 75, .22)); user-select: none; }
    .pet-bubble { position: absolute; left: calc(var(--pet-size) + 18px); right: 4px; top: 10px; max-width: 198px; padding: 8px 10px; border: 1px solid #e4e9f0; border-radius: 11px; background: rgba(255,255,255,.98); color: #51647f; font-size: 11px; line-height: 1.5; box-shadow: 0 8px 22px rgba(48,61,82,.16); }
    .pet-bubble:after { content: ""; position: absolute; left: -7px; bottom: 20px; width: 12px; height: 12px; background: #fff; border-left: 1px solid #e4e9f0; border-bottom: 1px solid #e4e9f0; transform: rotate(45deg); }
    .hidden { display: none !important; }
    .pet-menu { position: absolute; z-index: 8; min-width: 112px; padding: 4px; border: 1px solid #e1e7ef; border-radius: 8px; background: rgba(255,255,255,.99); box-shadow: 0 8px 24px rgba(32,48,75,.2); }
    .pet-menu button { width: 100%; border: 0; border-radius: 5px; background: transparent; color: #53647b; padding: 7px 9px; text-align: left; font-size: 10px; cursor: pointer; }
    .pet-menu button:hover { background: #f1f5fa; color: #293b57; }
    .pet-capture { position: absolute; left: calc(var(--pet-size) + 18px); right: 4px; top: 12px; bottom: 12px; z-index: 4; padding: 12px; border: 1px solid #dce5f0; border-radius: 16px; background: linear-gradient(160deg,rgba(255,255,255,.99),rgba(246,249,253,.98)); box-shadow: 0 12px 30px rgba(32,48,75,.18); display: flex; flex-direction: column; gap: 8px; }
    .pet-capture:before { content: ""; position: absolute; left: -7px; top: 38px; width: 13px; height: 13px; background: #fff; border-left: 1px solid #dce5f0; border-bottom: 1px solid #dce5f0; transform: rotate(45deg); }
    .pet-capture-head { display: flex; align-items: center; justify-content: space-between; color: #536a88; font-size: 11px; letter-spacing: .02em; }
    .pet-capture-head small { color: #9aa8ba; font-size: 9px; }
    .pet-capture textarea { display: block; width: 100%; flex: 1; min-height: 106px; max-height: 196px; resize: vertical; border: 1px solid #cbd9ea; border-radius: 10px; padding: 10px 11px; font: 12px/1.6 inherit; color: #32435c; outline: none; background: rgba(255,255,255,.92); box-shadow: inset 0 1px 3px rgba(46,68,97,.05); }
    .pet-capture textarea:focus { border-color: #8eacd4; box-shadow: 0 0 0 2px rgba(142,172,212,.16); }
    .pet-review { max-height: 190px; overflow: auto; }
    .pet-review-row { display: grid; grid-template-columns: 1fr 50px; gap: 5px; margin-bottom: 5px; }
    .pet-review-row input,.pet-review-row select { width: 100%; border: 1px solid #e3e8ef; border-radius: 5px; padding: 5px; font: 10px inherit; color: #42536c; }
    .capture-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 0; }
    .capture-actions button { border: 0; border-radius: 8px; min-height: 32px; padding: 7px 12px; font-size: 11px; cursor: pointer; transition: .15s; }
    .capture-actions button:hover { transform: translateY(-1px); }
    #petCancel { background: #edf1f6; color: #68778e; }
    #petPaste { background: #e8f0fb; color: #55759b; }
    #petSave { background: #293b57; color: #fff; box-shadow: 0 4px 10px rgba(41,59,87,.18); }
  </style>
</head>
<body>
  <div class="pet-shell" id="petShell">
    <div class="pet-bubble hidden" id="petBubble"></div>
    <img id="petImage" src="/assets/assistant_character.png" alt="SciPlan 小助手" draggable="false" />
    <div class="pet-capture hidden" id="petCapture">
      <div class="pet-capture-head"><span>随手记一条</span><small>识别后在 SciPlan 主窗口确认</small></div>
      <textarea id="petInput" placeholder="粘贴刚接到的任务…"></textarea>
      <div class="pet-review hidden" id="petReview"></div>
      <div class="capture-actions" id="petComposeActions"><button id="petCancel">收起</button><button id="petPaste">粘贴</button><button id="petSave">发送到 SciPlan</button></div>
      <div class="capture-actions hidden" id="petReviewActions"><button id="petReviewBack">返回修改</button><button id="petReviewConfirm">确认入库</button></div>
    </div>
    <div class="pet-menu hidden" id="petMenu"><button id="petHide">隐藏桌面助手</button></div>
  </div>
  <script src="/pet_desktop.js"></script>
</body>
</html>
